name: macOS artifacts

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS DMG and kitten
    runs-on: macos-latest
    env:
      # macos-latest currently runs a newer macOS than the target machines.
      # Keep the binaries loadable on macOS 15.x.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kitty build dependencies
        run: python3 .github/workflows/ci.py build

      - name: Install documentation dependencies
        run: python3 -m pip install -r docs/requirements.txt

      - name: Generate documentation and man pages
        run: make docs

      - name: Build macOS application bundle
        env:
          SLANGC: /tmp/slang/bin/slangc
        run: python3 setup.py kitty.app --update-check-interval=0 --verbose

      - name: Create DMG and collect kitten
        run: |
          hdiutil create -srcfolder kitty.app -volname kitty -format UDZO -ov -o kitty-macos.dmg
          cp kitty.app/Contents/MacOS/kitten kitten-macos
          chmod 755 kitten-macos

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kitty-macos-dmg
          path: kitty-macos.dmg
          if-no-files-found: error

      - name: Upload standalone kitten
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kitten-macos
          path: kitten-macos
          if-no-files-found: error
